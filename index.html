                                            <div key={i} className="bg-purple-900/30 border border-purple-500 p-2"><div className="flex items-center justify-between"><div><div className="text-[8px] font-bold">{char.name}</div><div className="text-[6px] text-purple-400">+{char.damage} DMG</div></div><button onClick={() => unequipCharacter(char)} className="bg-red-900 border border-red-600 px-3 py-1 text-[6px] font-bold pixel-btn">[ REMOVE ]</button></div></div>
                                        ))}
                                        {player?.equippedSword && (
                                            <div className="bg-red-900/30 border border-red-500 p-2"><div className="flex items-center justify-between"><div><div className="text-[8px] font-bold">⚔️ {player.equippedSword.name}</div><div className="text-[6px] text-red-400">+{formatNumber(player.equippedSword.damage)} DMG</div></div><button onClick={unequipSword} className="bg-red-900 border border-red-600 px-3 py-1 text-[6px] font-bold pixel-btn">[ REMOVE ]</button></div></div>
                                        )}
                                    </>
                                )}
                                {inventoryTab === 'swords' && player?.swords?.map((sword, i) => (
                                    <div key={i} className="bg-gray-900 border border-red-700 p-2"><div className="flex items-center justify-between"><div><div className="text-[8px] font-bold">{sword.name}</div><div className={`text-[6px] ${sword.rarity === 'ATOMIC' ? 'text-white' : 'text-red-400'}`}>+{formatNumber(sword.damage)} DMG</div></div><button onClick={() => equipSword(sword)} className="bg-red-900 border border-red-600 px-3 py-1 text-[6px] font-bold pixel-btn">[ EQUIP ]</button></div></div>
                                ))}
                            </div>
                        </div>
                    )}
                    
                    {/* TAB VIP */}
                    {activeTab === 'vip' && (
                        <div className="bg-black border-4 border-yellow-500 p-6">
                            <div className="text-center mb-6">
                                <div className="text-6xl mb-2">💎</div>
                                <h2 className="text-sm font-bold text-yellow-400">VIP SYSTEM</h2>
                                <p className="text-[6px] text-gray-500 mt-1">ACTIVATE VIP CODES TO GET PERMANENT BONUSES</p>
                            </div>
                            
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                                {VIP_LEVELS.filter(v => v.level > 0).map((vip) => (
                                    <div key={vip.level} className={`bg-gray-900 border-2 border-${vip.color} p-3 text-center ${player?.vipLevel >= vip.level ? 'bg-opacity-100' : 'bg-opacity-30'}`}>
                                        <div className={`text-${vip.color} text-xs font-bold`}>{vip.name}</div>
                                        <div className="text-yellow-400 text-lg font-bold mt-1">+{vip.bonus}%</div>
                                        <div className="text-[6px] text-gray-500 mt-1">ALL STATS BONUS</div>
                                        {player?.vipLevel >= vip.level && (
                                            <div className="text-green-400 text-[6px] mt-2">✓ ACTIVATED</div>
                                        )}
                                    </div>
                                ))}
                            </div>
                            
                            <div className="bg-gray-900 border-2 border-yellow-600 p-4">
                                <div className="text-yellow-400 text-[10px] mb-3">[ ACTIVATE VIP CODE ]</div>
                                <div className="flex gap-2">
                                    <input type="text" placeholder="XXXX-XXXX-XXXX" value={vipCode} onChange={(e) => setVipCode(e.target.value.toUpperCase())} className="flex-1 bg-black border-2 border-gray-700 p-2 text-green-400 text-[8px] font-mono focus:border-yellow-500 outline-none" />
                                    <button onClick={activateVIPCode} className="bg-yellow-800 border-2 border-yellow-600 px-4 py-2 text-[8px] font-bold pixel-btn">[ ACTIVATE ]</button>
                                </div>
                                <div className="text-[6px] text-gray-500 text-center mt-3">
                                    * VIP bonuses stack with all game mechanics (mining, combat, rewards)
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {/* TAB RANKING */}
                    {activeTab === 'ranking' && (
                        <div className="bg-black border-4 border-blue-500 p-4">
                            <div className="text-center mb-4">
                                <div className="text-4xl mb-2">🏆</div>
                                <h2 className="text-sm font-bold text-blue-400">GLOBAL RANKING</h2>
                                <p className="text-[6px] text-gray-500 mt-1">TOP PLAYERS WORLDWIDE</p>
                            </div>
                            
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div className="bg-gray-900 border border-yellow-600 p-3">
                                    <div className="text-yellow-400 text-[8px] text-center mb-2">💰 RICHEST PLAYERS</div>
                                    <table className="ranking-table">
                                        <thead><tr><th>#</th><th>PLAYER</th><th>COINS</th></tr></thead>
                                        <tbody>
                                            {topPlayers.coins.map((user, idx) => (
                                                <tr key={idx} className={user.username === player?.username ? 'bg-yellow-900/30' : ''}>
                                                    <td>{idx+1}</td><td>{user.username}</td><td>{formatNumber(user.gameData?.coins || 0)}</td>
                                                </tr>
                                            ))}
                                            {topPlayers.coins.length === 0 && <tr><td colSpan="3" className="text-center text-gray-500">NO DATA</td></tr>}
                                        </tbody>
                                    </table>
                                </div>
                                
                                <div className="bg-gray-900 border border-purple-600 p-3">
                                    <div className="text-purple-400 text-[8px] text-center mb-2">💎 GEM HOARDERS</div>
                                    <table className="ranking-table">
                                        <thead><tr><th>#</th><th>PLAYER</th><th>GEMS</th></tr></thead>
                                        <tbody>
                                            {topPlayers.gems.map((user, idx) => (
                                                <tr key={idx} className={user.username === player?.username ? 'bg-yellow-900/30' : ''}>
                                                    <td>{idx+1}</td><td>{user.username}</td><td>{user.gameData?.gems || 0}</td>
                                                </tr>
                                            ))}
                                            {topPlayers.gems.length === 0 && <tr><td colSpan="3" className="text-center text-gray-500">NO DATA</td></tr>}
                                        </tbody>
                                    </table>
                                </div>
                                
                                <div className="bg-gray-900 border border-green-600 p-3">
                                    <div className="text-green-400 text-[8px] text-center mb-2">⛏️ HIGHEST LEVEL</div>
                                    <table className="ranking-table">
                                        <thead><tr><th>#</th><th>PLAYER</th><th>LEVEL</th></tr></thead>
                                        <tbody>
                                            {topPlayers.level.map((user, idx) => (
                                                <tr key={idx} className={user.username === player?.username ? 'bg-yellow-900/30' : ''}>
                                                    <td>{idx+1}</td><td>{user.username}</td><td>{user.gameData?.pickaxeLevel || 0}</td>
                                                </tr>
                                            ))}
                                            {topPlayers.level.length === 0 && <tr><td colSpan="3" className="text-center text-gray-500">NO DATA</td></tr>}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                            <div className="text-center text-[6px] text-gray-500 mt-4">* Updated every 10 seconds</div>
                        </div>
                    )}
                    
                    {/* TAB ADMIN */}
                    {activeTab === 'admin' && isAdmin && (
                        <div className="bg-black border-4 border-red-500 p-4">
                            <div className="flex gap-2 mb-4 flex-wrap">
                                <button onClick={() => setAdminSubTab('users')} className={`px-3 py-1 border-2 text-[8px] font-bold transition ${adminSubTab === 'users' ? 'bg-red-900 border-red-500 text-red-400' : 'bg-gray-900 border-gray-700 text-gray-500'}`}>[ USERS ]</button>
                                <button onClick={() => setAdminSubTab('vipkeys')} className={`px-3 py-1 border-2 text-[8px] font-bold transition ${adminSubTab === 'vipkeys' ? 'bg-red-900 border-red-500 text-red-400' : 'bg-gray-900 border-gray-700 text-gray-500'}`}>[ VIP KEYS ]</button>
                                <button onClick={() => setAdminSubTab('create')} className={`px-3 py-1 border-2 text-[8px] font-bold transition ${adminSubTab === 'create' ? 'bg-red-900 border-red-500 text-red-400' : 'bg-gray-900 border-gray-700 text-gray-500'}`}>[ CREATE USER ]</button>
                                <button onClick={() => setAdminSubTab('stats')} className={`px-3 py-1 border-2 text-[8px] font-bold transition ${adminSubTab === 'stats' ? 'bg-red-900 border-red-500 text-red-400' : 'bg-gray-900 border-gray-700 text-gray-500'}`}>[ STATS ]</button>
                            </div>
                            
                            {adminSubTab === 'users' && (
                                <div>
                                    <div className="flex justify-between mb-3">
                                        <span className="text-red-400 text-[10px]">📋 USER LIST</span>
                                        <button onClick={() => exportUsersToCSV()} className="bg-blue-900 border border-blue-500 px-2 py-1 text-[6px] font-bold pixel-btn">[ EXPORT CSV ]</button>
                                    </div>
                                    <div className="overflow-x-auto max-h-96 overflow-y-auto">
                                        <table className="admin-table w-full text-left">
                                            <thead><tr><th>ID</th><th>USERNAME</th><th>EMAIL</th><th>ADMIN</th><th>COINS</th><th>GEMS</th><th>LEVEL</th><th>VIP</th><th>ACTIONS</th></tr></thead>
                                            <tbody>
                                                {adminUsers.map(user => (
                                                    <tr key={user.id}>
                                                        <td>{user.id}</td>
                                                        <td className="font-bold text-green-400">{user.username}</td>
                                                        <td className="text-[8px]">{user.email}</td>
                                                        <td>{user.isAdmin ? '👑' : '❌'}</td>
                                                        <td>{formatNumber(user.gameData?.coins || 0)}</td>
                                                        <td>{user.gameData?.gems || 0}</td>
                                                        <td>{user.gameData?.pickaxeLevel || 0}</td>
                                                        <td>{user.gameData?.vipLevel || 0}</td>
                                                        <td>
                                                            <button onClick={() => adminEditUser(user.username)} className="bg-blue-900 px-2 py-1 text-[6px] mr-1 pixel-btn">EDIT</button>
                                                            <button onClick={() => adminDeleteUser(user.username)} className="bg-red-900 px-2 py-1 text-[6px] pixel-btn">DEL</button>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}
                            
                            {adminSubTab === 'vipkeys' && (
                                <div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div className="bg-gray-900 border border-yellow-600 p-3">
                                            <span className="text-yellow-400 text-[8px]">🔑 GENERATE VIP KEYS</span>
                                            <div className="mt-2 space-y-2">
                                                <select value={adminVipLevel} onChange={(e) => setAdminVipLevel(e.target.value)} className="w-full bg-black border border-gray-700 p-2 text-[8px] text-yellow-400">
                                                    <option>BRONZE</option><option>SILVER</option><option>GOLD</option><option>PLATINUM</option><option>DIAMOND</option>
                                                </select>
                                                <input type="number" min="1" max="100" value={adminKeyQuantity} onChange={(e) => setAdminKeyQuantity(Math.min(100, parseInt(e.target.value) || 1))} className="w-full bg-black border border-gray-700 p-2 text-[8px] text-yellow-400" />
                                                <button onClick={adminGenerateKeys} className="w-full bg-yellow-800 border border-yellow-600 py-2 text-[8px] font-bold pixel-btn">[ GENERATE KEYS ]</button>
                                            </div>
                                        </div>
                                        <div className="bg-gray-900 border border-green-600 p-3">
                                            <span className="text-green-400 text-[8px]">📜 GENERATED KEYS</span>
                                            <div className="mt-2 max-h-48 overflow-y-auto space-y-1">
                                                {generatedKeys.map((key, i) => (
                                                    <div key={i} className="bg-black border border-gray-700 p-1 text-[6px] text-yellow-400 font-mono break-all">{key}</div>
                                                ))}
                                                {generatedKeys.length === 0 && <div className="text-gray-500 text-[6px] text-center">No keys generated yet</div>}
                                            </div>
                                        </div>
                                    </div>
                                    <div className="mt-4 bg-gray-900 border border-purple-600 p-3">
                                        <span className="text-purple-400 text-[8px]">📋 ALL VIP KEYS</span>
                                        <div className="mt-2 max-h-48 overflow-y-auto">
                                            <table className="admin-table w-full text-left text-[8px]">
                                                <thead><tr><th>KEY</th><th>LEVEL</th><th>STATUS</th><th>USED BY</th></tr></thead>
                                                <tbody>
                                                    {adminVIPKeys.slice().reverse().map((key, i) => (
                                                        <tr key={i}><td className="font-mono">{key.key}</td><td>{key.vipLevel}</td><td className={key.used ? 'text-red-400' : 'text-green-400'}>{key.used ? 'USED' : 'ACTIVE'}</td><td>{key.usedBy || '-'}</td></tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            )}
                            
                            {adminSubTab === 'create' && (
                                <div className="max-w-md mx-auto">
                                    <div className="space-y-3">
                                        <input type="text" placeholder="USERNAME" value={newUsername} onChange={(e) => setNewUsername(e.target.value)} className="w-full bg-gray-900 border border-gray-700 p-2 text-xs text-green-400" />
                                        <input type="email" placeholder="EMAIL" value={newEmail} onChange={(e) => setNewEmail(e.target.value)} className="w-full bg-gray-900 border border-gray-700 p-2 text-xs text-green-400" />
                                        <input type="password" placeholder="PASSWORD" value={newPassword} onChange={(e) => setNewPassword(e.target.value)} className="w-full bg-gray-900 border border-gray-700 p-2 text-xs text-green-400" />
                                        <label className="flex items-center gap-2"><input type="checkbox" checked={newIsAdmin} onChange={(e) => setNewIsAdmin(e.target.checked)} /><span className="text-[8px] text-gray-400">Admin User</span></label>
                                        <button onClick={adminCreateUser} className="w-full bg-blue-800 border border-blue-500 py-2 text-[8px] font-bold pixel-btn">[ CREATE USER ]</button>
                                    </div>
                                </div>
                            )}
                            
                            {adminSubTab === 'stats' && (
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                    <div className="bg-gray-900 border border-green-600 p-3 text-center"><div className="text-green-400 text-[8px]">TOTAL USERS</div><div className="text-lg font-bold">{adminStats.totalUsers || 0}</div></div>
                                    <div className="bg-gray-900 border border-yellow-600 p-3 text-center"><div className="text-yellow-400 text-[8px]">VIP KEYS</div><div className="text-lg font-bold">{adminStats.totalVIPKeys || 0}</div></div>
                                    <div className="bg-gray-900 border border-purple-600 p-3 text-center"><div className="text-purple-400 text-[8px]">USED KEYS</div><div className="text-lg font-bold">{adminStats.usedVIPKeys || 0}</div></div>
                                    <div className="bg-gray-900 border border-blue-600 p-3 text-center"><div className="text-blue-400 text-[8px]">ADMINS</div><div className="text-lg font-bold">{adminStats.adminUsers || 0}</div></div>
                                </div>
                            )}
                        </div>
                    )}
                    
                    {/* Admin Panel Flutuante */}
                    {isAdmin && activeTab !== 'admin' && (
                        <div className={`fixed bottom-2 right-2 bg-black border-4 border-red-500 z-50 transition-all duration-200 ${adminMinimized ? 'admin-minimized' : 'admin-expanded'}`}>
                            <div className="bg-red-900 px-3 py-2 flex justify-between items-center cursor-pointer" onClick={() => setAdminMinimized(!adminMinimized)}>
                                <span className="text-red-400 text-[8px] font-bold">[ ADMIN PANEL ]</span>
                                <button className="text-red-400 text-[10px] font-bold pixel-btn">{adminMinimized ? '[ + ]' : '[ - ]'}</button>
                            </div>
                            {!adminMinimized && (
                                <div className="p-3">
                                    <div className="space-y-1">
                                        <input type="text" placeholder="> TARGET USER" value={adminTarget} onChange={(e) => setAdminTarget(e.target.value)} className="w-full bg-gray-900 border border-gray-700 p-1 text-[6px] text-red-400 font-mono" />
                                        <input type="number" placeholder="> COINS" value={adminCoins} onChange={(e) => setAdminCoins(e.target.value)} className="w-full bg-gray-900 border border-gray-700 p-1 text-[6px] text-red-400 font-mono" />
                                        <input type="number" placeholder="> GEMS" value={adminGems} onChange={(e) => setAdminGems(e.target.value)} className="w-full bg-gray-900 border border-gray-700 p-1 text-[6px] text-red-400 font-mono" />
                                        <input type="number" placeholder="> STONES" value={adminStones} onChange={(e) => setAdminStones(e.target.value)} className="w-full bg-gray-900 border border-gray-700 p-1 text-[6px] text-red-400 font-mono" />
                                        <input type="number" placeholder="> KEYS" value={adminKeys} onChange={(e) => setAdminKeys(e.target.value)} className="w-full bg-gray-900 border border-gray-700 p-1 text-[6px] text-red-400 font-mono" />
                                        <input type="number" placeholder="> DAMAGE" value={adminDamage} onChange={(e) => setAdminDamage(e.target.value)} className="w-full bg-gray-900 border border-gray-700 p-1 text-[6px] text-red-400 font-mono" />
                                        <button onClick={adminGiveStats} className="w-full bg-red-900 border border-red-600 py-1 text-[6px] font-bold pixel-btn mt-2">[ APPLY ]</button>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<AnimeMasters />);
    </script>
</body>
</html>
